name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.3 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @cubbie/api test
      - run: pnpm --filter @cubbie/web build
      - run: python3 skills/cubbie-dashboard-sync/scripts/push.py --url https://example.com --input skills/cubbie-dashboard-sync/sample-batch.json --dry-run
        env: { CUBBIE_DASHBOARD_API_KEY: ci }
      - run: pnpm --filter @cubbie/infra exec cdk synth --quiet
