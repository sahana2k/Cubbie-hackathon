# Hosted Cubbie dashboard: the app (Python backend + Tesseract + React build) behind Caddy.
# The database is Amazon RDS (DATABASE_URL in .env), so nothing here holds project data
# except the small app-data volume (connection settings).
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PUBLIC_HOSTS: ${DOMAIN}
    volumes:
      - app-data:/data
    expose:
      - "8787"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  app-data:
  caddy-data:
  caddy-config:
